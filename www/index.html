        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

        <!-- v3 removed the service worker: unregister workers and delete caches
             left behind by earlier versions, so stale clients stop serving old
             builds. Can be removed once pre-v3 clients have cycled through. -->
        <script>
            navigator.serviceWorker?.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
            window.caches?.keys().then(keys => keys.forEach((key) => {
                if (key.startsWith('superSplat-v')) caches.delete(key);
            }));
        </script>

    <body>

             纯 ES5，零依赖，正常启动时不会显示任何 UI。 -->
