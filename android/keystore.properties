# 固定 debug 签名配置（v28d）
#
# 这个文件跟着仓库走，让每次 CI 构建签出同一张证书。否则每次 CI 现场生成
# 新密钥，新包就装不上旧版（INSTALL_FAILED_UPDATE_INCOMPATIBLE / "应用未安装"）。
#
# 安全性：ss-debug.p12 是 **debug 密钥**，公开仓库里放它没有实际风险——
# 它本来就应该在开发者手里，任何人能拿它签名的包也只能是 debug 包。
# 真正需要保密的是 release 密钥（*.jks / *.keystore），那些仍然在 .gitignore 里。
#
# storeFile 相对 android/app/build.gradle 解析（Gradle 的 file() 以模块目录为基准）。
storeFile=keystore/ss-debug.p12
storePassword=supersplat
keyAlias=supersplat
keyPassword=supersplat
