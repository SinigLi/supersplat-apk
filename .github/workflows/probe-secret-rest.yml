name: probe other secrets
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: echo
        env:
          A: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          B: ${{ secrets.ANDROID_KEY_ALIAS }}
          C: ${{ secrets.ANDROID_KEY_PASS }}
        run: echo "lens=${#A},${#B},${#C}"
