<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>分级工具栏原型 v7（三停靠组 + 可收缩）</title>
<style>
:root { --btn: 52px; --gap: 10px; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body { height:100%; overflow:hidden; }
body { font-family: system-ui, sans-serif; background:#2b2e33; color:#e8e8e8; touch-action: manipulation;
       overscroll-behavior: none; }
body.drag-any { touch-action: none; overscroll-behavior: contain; }

#canvas-sim { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#555; font-size:14px; user-select:none; }

/* ===== 停靠组：class 定基准（四边），拖动时内联覆盖 ===== */
.dock { position:fixed; z-index:100; display:flex; gap:var(--gap); padding:10px;
        background:rgba(21,24,28,.95); border-radius:14px;
        box-shadow:0 4px 16px rgba(0,0,0,.5); align-items:center; }
.dock.bottom { bottom:calc(env(safe-area-inset-bottom,0px) + 10px); left:50%; transform:translateX(-50%); flex-direction:row; }
.dock.top    { top:calc(env(safe-area-inset-top,0px) + 10px); left:50%; transform:translateX(-50%); flex-direction:row; }
.dock.left   { left:10px; top:50%; transform:translateY(-50%); flex-direction:column; }
.dock.right  { right:10px; top:50%; transform:translateY(-50%); flex-direction:column; }
.dock.dragging { opacity:.9; }
/* 超屏滚动：横排横向滚，纵排纵向滚；隐藏滚动条保持外观 */
.dock { scrollbar-width: none; }
.dock::-webkit-scrollbar { display: none; }
.dock.bottom, .dock.top { overflow-x: auto; overflow-y: hidden; max-width: calc(100vw - 16px); }
.dock.left, .dock.right { overflow-y: auto; overflow-x: hidden; max-height: calc(100vh - 16px); }
/* 收缩态：整组缩成小圆球 */
.dock.collapsed { padding:0; background:transparent; box-shadow:none; border-radius:50%; overflow:visible; }
.dock.collapsed .grp-btn, .dock.collapsed .dock-label, .dock.collapsed .dock-collapse { display:none; }

.dock .drag-handle { min-width:18px; min-height:18px; display:flex; align-items:center; justify-content:center;
                     color:#777; font-size:14px; cursor:grab; touch-action:none; flex-shrink:0; letter-spacing:2px; }
.dock.left .drag-handle, .dock.right .drag-handle { writing-mode:vertical-lr; }
.dock.collapsed .drag-handle { width:52px; height:52px; background:rgba(21,24,28,.95); border-radius:50%;
                               color:#4a9eff; font-size:20px; box-shadow:0 4px 16px rgba(0,0,0,.5); writing-mode:horizontal-tb; }
/* 组标签 + 收起按钮 */
.dock-label { font-size:11px; color:#888; writing-mode:vertical-lr; letter-spacing:2px; }
.dock.bottom .dock-label, .dock.top .dock-label { writing-mode:horizontal-tb; }
.dock-collapse { width:26px; height:26px; border-radius:8px; border:1px solid rgba(255,255,255,.1);
                 background:#2f3338; color:#888; font-size:12px; cursor:pointer; flex-shrink:0;
                 display:flex; align-items:center; justify-content:center; }

/* 大类按钮 */
.grp-btn { width:var(--btn); height:var(--btn); border-radius:12px; border:1px solid rgba(255,255,255,.1);
           background:#3a3f46; color:#ccc; display:flex; flex-direction:column; align-items:center; justify-content:center;
           font-size:10px; gap:2px; cursor:pointer; position:relative; flex-shrink:0; }
.grp-btn .ico { font-size:20px; }
.grp-btn.active { background:#2563eb; color:#fff; border-color:#3b82f6; }
.grp-btn .dot { position:absolute; top:4px; right:4px; width:8px; height:8px; border-radius:50%;
                background:#f59e0b; display:none; }
.grp-btn.has-active .dot { display:block; }

/* 子工具浮层 */
.sub-wrap { position:fixed; z-index:99; display:flex; gap:8px; padding:8px;
            background:rgba(30,33,38,.97); border-radius:12px; box-shadow:0 4px 16px rgba(0,0,0,.5);
            opacity:0; pointer-events:none; transition:opacity .18s ease; }
.sub-wrap.open { opacity:1; pointer-events:auto; }
.sub-wrap.up   { flex-direction:row; }
.sub-wrap.side { flex-direction:column; }

.tool-btn { min-width:46px; height:46px; padding:0 8px; border-radius:10px; border:1px solid rgba(255,255,255,.08);
            background:#2f3338; color:#bbb; display:flex; flex-direction:column; align-items:center; justify-content:center;
            font-size:10px; gap:2px; cursor:pointer; }
.tool-btn .ico { font-size:18px; }
.tool-btn.tool-type.active { background:#2563eb; color:#fff; border-color:#3b82f6; }
.tool-btn.cmd-type:active { filter:brightness(1.6); }
.tool-btn.cmd-type.flash { background:#f59e0b; color:#000; }

#hint { position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); left:8px; font-size:11px; color:#777; z-index:200; }
</style>
</head>
<body>
<div id="canvas-sim">（画布区域 — 原型模拟）</div>
<div id="hint">v7：三组停靠（顶=文件 / 底=编辑 / 右=视图）<br>每组可拖动吸附、点「▪」收缩成圆球<br>大类点击展开子工具（可多开）</div>

<script>
// ================= 工具数据 =================
const GROUPS = {
  select: { ico:'🎯', name:'选择', tools:[
    {id:'picker',  ico:'👆', name:'点选',  type:'tool'},
    {id:'brush',   ico:'🖌️', name:'笔刷',  type:'tool'},
    {id:'polygon', ico:'🪢', name:'套索',  type:'tool'},
    {id:'sphere',  ico:'🔮', name:'球选',  type:'tool'},
    {id:'eyedrop', ico:'💧', name:'吸管',  type:'tool'},
  ]},
  xform: { ico:'🔢', name:'变换', tools:[
    {id:'move',    ico:'✥', name:'移动',  type:'tool'},
    {id:'rotate',  ico:'🔄', name:'旋转',  type:'tool'},
    {id:'scale',   ico:'⤢', name:'缩放',  type:'tool'},
    {id:'orient',  ico:'🧭', name:'定向',  type:'tool'},
    {id:'coords',  ico:'🌐', name:'全局',  type:'tool'},
  ]},
  shape: { ico:'✂️', name:'裁剪', tools:[
    {id:'box',      ico:'📦', name:'盒体', type:'tool'},
    {id:'spheresel',ico:'⚪', name:'球体', type:'tool'},
  ]},
  measure: { ico:'📐', name:'测量', tools:[
    {id:'ruler',    ico:'📏', name:'测距',   type:'tool'},
    {id:'angle',    ico:'📐', name:'测角',   type:'tool'},
    {id:'cursor3d', ico:'✚', name:'3D游标', type:'tool'},
  ]},
  file: { ico:'📁', name:'文件', tools:[
    {id:'open',   ico:'📂', name:'打开',   type:'cmd'},
    {id:'save',   ico:'💾', name:'保存',   type:'cmd'},
    {id:'export', ico:'📤', name:'导出',   type:'cmd'},
    {id:'publish',ico:'🚀', name:'发布',   type:'cmd'},
    {id:'settings',ico:'⚙️', name:'设置',  type:'cmd'},
    {id:'keys',   ico:'⌨️', name:'快捷键', type:'cmd'},
  ]},
  view: { ico:'👁', name:'视图', tools:[
    {id:'appearance',ico:'🎨', name:'外观',   type:'cmd'},
    {id:'overlays',  ico:'🗂', name:'浮层',   type:'tool'},
    {id:'orbit',     ico:'🛰', name:'轨道相机', type:'tool'},
    {id:'fly',       ico:'🚁', name:'飞行相机', type:'tool'},
    {id:'frame',     ico:'🔍', name:'框选视野', type:'cmd'},
    {id:'origin',    ico:'🏠', name:'回原点',  type:'cmd'},
  ]},
};

// 三个停靠组定义：顶=文件 / 底=编辑 / 右=视图
const DOCKS = [
  { id:'file', label:'文件', pos:'top',    groupIds:['file'] },
  { id:'edit', label:'编辑', pos:'bottom', groupIds:['select','xform','shape','measure'],
    extra:[ {id:'undo', ico:'↶', name:'撤销', type:'cmd'}, {id:'redo', ico:'↷', name:'重做', type:'cmd'} ] },
  { id:'view', label:'视图', pos:'right',  groupIds:['view'] },
];

// ================= 停靠组工厂 =================
const allPanels = new Map();   // grpId -> wrap
const docks = [];

function buildDock(def) {
  const dock = document.createElement('div');
  dock.className = 'dock ' + def.pos;
  dock.dataset.dock = def.id;
  document.body.appendChild(dock);

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.innerHTML = '≡';

  const label = document.createElement('div');
  label.className = 'dock-label';
  label.textContent = def.label;

  const collapse = document.createElement('div');
  collapse.className = 'dock-collapse';
  collapse.innerHTML = '▪';
  collapse.title = '收缩/展开';

  def.groupIds.forEach(gid => dock.appendChild(makeGroupBtn(gid, dock)));
  (def.extra || []).forEach(t => {
    const tb = document.createElement('div');
    tb.className = 'grp-btn';
    tb.style.width = '52px';
    tb.innerHTML = `<span class="ico">${t.ico}</span><span>${t.name}</span>`;
    tb.onclick = () => { tb.classList.add('flash'); setTimeout(()=>tb.classList.remove('flash'), 250); showMsg(t.name); };
    dock.appendChild(tb);
  });

  dock.appendChild(label);
  dock.appendChild(collapse);
  dock.insertBefore(handle, dock.firstChild);

  const st = { def, dock, handle, pos: def.pos, freePos: null, openPanels: new Set(), collapsed: false };

  // 收缩/展开：收缩后点圆球（把手）还原；展开态点「▪」收缩
  collapse.onclick = (e) => {
    e.stopPropagation();
    setCollapsed(st, !st.collapsed);
  };
  handle.addEventListener('click', (e) => {
    if (!st.collapsed) return;      // 展开态把手只负责拖动
    e.stopPropagation();
    setCollapsed(st, false);
  });

  setupDrag(st);
  docks.push(st);
  applyDockPos(st);
  return st;
}

function setCollapsed(st, v) {
  st.collapsed = v;
  st.dock.classList.toggle('collapsed', v);
  st.handle.innerHTML = v ? st.def.label : '≡';
  if (v) closeAll(st);
  else { applyDockPos(st); }
}

function makeGroupBtn(gid, dock) {
  const g = GROUPS[gid];
  const btn = document.createElement('div');
  btn.className = 'grp-btn'; btn.dataset.grp = gid;
  btn.innerHTML = `<span class="ico">${g.ico}</span><span>${g.name}</span><span class="dot"></span>`;

  const wrap = document.createElement('div');
  wrap.className = 'sub-wrap'; wrap.dataset.grp = gid;
  g.tools.forEach(t => {
    const tb = document.createElement('div');
    tb.className = `tool-btn ${t.type==='cmd'?'cmd-type':'tool-type'}`;
    tb.innerHTML = `<span class="ico">${t.ico}</span><span>${t.name}</span>`;
    tb.onclick = (ev) => {
      ev.stopPropagation();
      if (t.type === 'cmd') { tb.classList.add('flash'); setTimeout(()=>tb.classList.remove('flash'), 250); }
      else {
        wrap.querySelectorAll('.tool-btn').forEach(b=>b.classList.remove('active'));
        tb.classList.add('active');
        updateDots(gid);
      }
      showMsg(g.name + ' → ' + t.name);
    };
    wrap.appendChild(tb);
  });
  document.body.appendChild(wrap);
  allPanels.set(gid, wrap);

  btn.onclick = () => toggleGroup(gid, dock);
  return btn;
}

function dockOfGroup(gid) { return docks.find(s => s.def.groupIds.includes(gid)); }

function toggleGroup(gid, dock) {
  const st = docks.find(s => s.def.groupIds.includes(gid));
  const wrap = allPanels.get(gid);
  const btn = dock.querySelector(`[data-grp="${gid}"]`);
  if (st.openPanels.has(gid)) {
    st.openPanels.delete(gid); wrap.classList.remove('open'); btn.classList.remove('active');
  } else {
    st.openPanels.add(gid); btn.classList.add('active');
    placeWrap(gid, st);
    wrap.classList.add('open');
    requestAnimationFrame(() => requestAnimationFrame(() => { if (st.openPanels.has(gid)) placeWrap(gid, st); }));
  }
}

function updateDots(gid) {
  const wrap = allPanels.get(gid);
  const st = dockOfGroup(gid);
  const has = wrap.querySelector('.tool-btn.active');
  const btn = st.dock.querySelector(`[data-grp="${gid}"]`);
  if (btn) btn.classList.toggle('has-active', !!has);
}

function closeAll(st) {
  st.openPanels.forEach(gid => {
    allPanels.get(gid).classList.remove('open');
    const b = st.dock.querySelector(`[data-grp="${gid}"]`);
    if (b) b.classList.remove('active');
  });
  st.openPanels.clear();
}

// ================= 定位 =================
function applyDockPos(st) {
  const { dock } = st;
  dock.className = 'dock ' + st.pos + (st.collapsed ? ' collapsed' : '');
  dock.style.left=''; dock.style.top=''; dock.style.right=''; dock.style.bottom=''; dock.style.transform='';
  if (!st.freePos) return;
  const r = dock.getBoundingClientRect();
  if (st.pos==='bottom' || st.pos==='top') {
    dock.style.transform = 'none';
    dock.style.left = st.freePos.left + 'px';
  } else {
    dock.style.transform = 'none';
    dock.style.top = st.freePos.top + 'px';
  }
}

function placeWrap(gid, st) {
  const btn = st.dock.querySelector(`[data-grp="${gid}"]`);
  const wrap = allPanels.get(gid);
  wrap.style.left = ''; wrap.style.top = '';
  const vertical = (st.pos==='left' || st.pos==='right');
  wrap.classList.toggle('side', vertical);
  wrap.classList.toggle('up', !vertical);
  wrap.style.visibility = 'hidden'; wrap.classList.add('open');
  const b = btn.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  wrap.style.visibility = '';
  const slot = Array.from(st.openPanels).indexOf(gid);
  if (!vertical) {
    const stagger = slot * (w.height + 8);
    let left = Math.max(8, Math.min(b.left + b.width/2 - w.width/2, innerWidth - w.width - 8));
    let top = st.pos==='bottom' ? b.top - w.height - 10 - stagger : b.bottom + 10 + stagger;
    top = Math.max(8, Math.min(top, innerHeight - w.height - 8));
    wrap.style.left = left + 'px'; wrap.style.top = top + 'px';
  } else {
    const stagger = slot * (w.width + 8);
    let top = Math.max(8, Math.min(b.top + b.height/2 - w.height/2, innerHeight - w.height - 8));
    let left = st.pos==='left' ? b.right + 10 + stagger : b.left - w.width - 10 - stagger;
    left = Math.max(8, Math.min(left, innerWidth - w.width - 8));
    wrap.style.left = left + 'px'; wrap.style.top = top + 'px';
  }
}

// ================= 拖动 + 实时换向 + 磁性吸附 =================
function nearestEdge(x, y) {
  const dist = { top: y*0.8, bottom: (innerHeight - y)*0.8, left: x, right: innerWidth - x };
  return Object.keys(dist).sort((a,b)=>dist[a]-dist[b])[0];
}

function setupDrag(st) {
  const { dock, handle } = st;
  let drag = null;

  handle.addEventListener('pointerdown', (e) => {
    e.preventDefault(); e.stopPropagation();
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { moved:false, free:null, pid:e.pointerId, lastX:e.clientX, lastY:e.clientY };
    dock.classList.add('dragging');
    document.body.classList.add('drag-any');
  });
  addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.pid) return;
    const mdx = e.clientX - drag.lastX, mdy = e.clientY - drag.lastY;
    drag.lastX = e.clientX; drag.lastY = e.clientY;
    if (!drag.moved && Math.abs(mdx) < 4 && Math.abs(mdy) < 4) return;
    drag.moved = true;
    e.preventDefault();
    if (st.collapsed) return;   // 收缩球不换向，只跟手
    const edge = nearestEdge(e.clientX, e.clientY);
    if (edge !== st.pos) {
      st.pos = edge;
      dock.className = 'dock ' + edge;
      dock.offsetHeight;
    }
    dock.style.right = 'auto'; dock.style.bottom = 'auto';
    const r = dock.getBoundingClientRect();
    const nl = Math.max(6, Math.min(e.clientX - r.width/2,  innerWidth  - r.width  - 6));
    const nt = Math.max(6, Math.min(e.clientY - r.height/2, innerHeight - r.height - 6));
    dock.style.transform = 'none';
    dock.style.left = nl + 'px';
    dock.style.top  = nt + 'px';
    drag.free = { left: nl, top: nt };
  }, {passive:false});
  function endDrag(e) {
    if (!drag) return;
    if (e && e.pointerId !== undefined && e.pointerId !== drag.pid) return;
    const moved = drag.moved, free = drag.free;
    dock.classList.remove('dragging');
    document.body.classList.remove('drag-any');
    drag = null;
    if (!moved || !free) return;
    const r = dock.getBoundingClientRect();
    const m = 8;
    if (st.pos==='bottom' || st.pos==='top') st.freePos = { left: Math.max(m, Math.min(free.left, innerWidth - r.width - m)) };
    else st.freePos = { top: Math.max(m, Math.min(free.top, innerHeight - r.height - m)) };
    closeAll(st);
    applyDockPos(st);
    dock.offsetHeight;
    requestAnimationFrame(() => Array.from(st.openPanels).forEach(gid => placeWrap(gid, st)));
    showMsg(st.def.label + '组已吸附: ' + ({top:'顶部',bottom:'底部',left:'左侧',right:'右侧'})[st.pos]);
  }
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);
}

addEventListener('resize', () => docks.forEach(st => { st.freePos = null; applyDockPos(st); closeAll(st); }));

// ================= 提示 =================
let msgTimer;
function showMsg(t) {
  let el = document.getElementById('msg');
  if (!el) { el = document.createElement('div'); el.id='msg';
    el.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#2563eb;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:300;transition:opacity .3s;opacity:0';
    document.body.appendChild(el); }
  el.textContent = t; el.style.opacity = 1;
  clearTimeout(msgTimer); msgTimer = setTimeout(()=>el.style.opacity=0, 900);
}

// ================= 启动 =================
DOCKS.forEach(buildDock);
</script>
</body>
</html>
